<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación HTML - Joset Abarca</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="row mb-4">
        <div class="col-md-8 mx-auto">
            <form id="searchForm" class="d-flex gap-2">
                <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Buscar ciudad, acción o moneda..."
                    required>
                <button type="submit" class="btn btn-dark">
                    Buscar
                </button>
            </form>
        </div>
    </div>

    <div class="container py-4">
        <h1 class="text-center mb-4">Dashboard de APIs</h1>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white">
                        Tipo de Cambio
                    </div>
                    <div class="card-body">
                        <pre id="exchange-res">Cargando...</pre>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-secondary text-white">
                        Mercado de Acciones
                    </div>
                    <div class="card-body">
                        <pre id="market-res">Cargando...</pre>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-dark text-white">
                        Clima Actual
                    </div>
                    <div class="card-body">
                        <pre id="weather-res">Cargando...</pre>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
